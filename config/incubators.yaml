# The ~20 European compute-relevant deep-tech incubators/accelerators this pipeline tracks.
# Seeded from prior manual research (Aug 2026). Add a new program by adding a row here —
# the pipeline picks it up on the next run. `portfolio_url` is where the Scout agent looks
# first for current cohort/portfolio companies; falls back to `url` if not set.
#
# compute_focus:
#   high    - compute/semiconductors/quantum is the program's explicit mandate
#   medium  - general deep tech with compute regularly in scope
# eligibility: internal | external | hybrid  (internal = own researchers only)

- id: cdl-ngc
  name: "CDL Next Gen Computing"
  country: "Germany (Berlin, hosted by ESMT/DEEP)"
  type: "startup accelerator (mentor-driven cohort)"
  compute_focus: high
  eligibility: external
  url: "https://creativedestructionlab.com/streams/next-gen-computing/"
  portfolio_url: "https://creativedestructionlab.com/streams/next-gen-computing/"
  notes: "The stream this project was originally built to support. Track separately as ground truth."

