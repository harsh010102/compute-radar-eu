# Curated startup-news / funding-database sites the Scout uses as an EXTRA discovery path
# beyond each incubator's own (often thin) portfolio page. The Scout queries these with
# site-scoped searches, e.g.  site:startupticker.ch <program or company name>  — which
# surfaces funding announcements and cohort write-ups that the incubator's own site omits.
#
# Matched to each incubator by region (see src/compute_radar/sources.py). `focus: compute`
# sources (quantum / semiconductors / HPC / data-center) are relevant to every program in
# this project and are always eligible regardless of region.
#
# region: dach | benelux | nordics | france | iberia | italy | uk-ireland | cee |
#         north-america | europe (pan-EU) | global
# focus:  general | quantum | semiconductors | hpc | datacenter

# --- pan-European / global general ---
# NOTE: eu-startups.com also has a STRUCTURED, keyword-searchable directory
# (/directory/?wpbdp_view=search&kw=<term>) with per-company country/description/website.
# That's scraped separately by src/compute_radar/discover_from_directory.py — richer than
# the site-scoped news search this file drives.
- domain: eu-startups.com
  name: "EU-Startups"
  region: europe
  focus: general
- domain: tech.eu
  name: "Tech.eu"
  region: europe
  focus: general
- domain: sifted.eu
  name: "Sifted"
  region: europe
  focus: general
- domain: techfundingnews.com
  name: "Tech Funding News"
  region: global
  focus: general

