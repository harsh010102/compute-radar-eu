name: Weekly refresh

# The "living pipeline" mechanism: re-runs the Scout/Analyst crew against every tracked
# incubator on a schedule and commits the updated data/startups.json. Free on a public
# GitHub repo - no server to run or pay for.
#
# Setup: add OPENROUTER_API_KEY and/or GEMINI_API_KEY as repository secrets (Settings ->
# Secrets and variables -> Actions) before this workflow can do anything beyond checkout.
# With both set, the pipeline round-robins incubators across the two and falls back from
# one to the other on a rate-limit - see src/compute_radar/llm_provider.py.

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays ~06:17 UTC - off the hour, per cron best practice
  workflow_dispatch:        # lets you trigger a run manually from the Actions tab
    inputs:
      incubator:
        description: "Single incubator id to test (leave blank to run --all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-oss-20b:free' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          INCUBATOR_INPUT: ${{ github.event.inputs.incubator }}
        run: |
          if [ -n "$INCUBATOR_INPUT" ]; then
            python -m compute_radar.pipeline --incubator "$INCUBATOR_INPUT"
          else
            python -m compute_radar.pipeline --all
          fi

      - name: Commit updated data
        run: |
          git config user.name "compute-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/startups.json
          git diff --cached --quiet || git commit -m "Weekly refresh: $(date -u +%Y-%m-%d)"
          git push
